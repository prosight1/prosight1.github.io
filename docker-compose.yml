services:
  allconfig-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allconfig_showcase_web
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001"]
      interval: 30s
      timeout: 5s
      retries: 3